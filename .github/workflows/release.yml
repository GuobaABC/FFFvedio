name: 发布构建

# 推送 v* 标签（例如 v0.0.1）时自动产出 Windows 安装包与 macOS dmg，并挂到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则取 wails.json 的 productVersion）'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_NAME: FFFVedioAgent

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 NSIS 与 ffmpeg
        shell: pwsh
        run: |
          choco install nsis ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force -Path build\deps\bin | Out-Null
          Copy-Item (Get-Command ffmpeg.exe).Source build\deps\bin\ffmpeg.exe -Force
          $ffprobe = Get-Command ffprobe.exe -ErrorAction SilentlyContinue
          if ($ffprobe) { Copy-Item $ffprobe.Source build\deps\bin\ffprobe.exe -Force }
          New-Item -ItemType Directory -Force -Path build\windows\installer\tmp | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile build\windows\installer\tmp\MicrosoftEdgeWebview2Setup.exe

      - name: 构建
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ github.event.inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/bin/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建 dmg / zip
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            build/bin/*.dmg
            build/bin/*.zip
          if-no-files-found: error

  release:
    name: 发布
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          ls -lh dist/*
          gh release create "$VERSION" \
            --title "FFFVedioAgent $VERSION" \
            --generate-notes \
            dist/windows/* \
            dist/macos-arm64/* \
            dist/macos-x86_64/*
